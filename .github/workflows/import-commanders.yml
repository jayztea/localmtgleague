name: Import Scryfall Commanders


on:

  schedule:

    - cron: "0 4 * * 1"


  workflow_dispatch:



jobs:

  import-commanders:


    runs-on: ubuntu-latest



    steps:


      - name: Run Commander Import


        run: |

          curl \
          -X POST \
          -H "Authorization: Bearer ${{ secrets.IMPORT_SECRET }}" \
          https://localmtgleague.onrender.com/admin/import-commanders